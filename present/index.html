<style>
*{box-sizing:border-box;min-width:0}html,body{margin:0;height:100%;background:#0c1330}body{overflow:hidden;font:16px/1.5 Inter,system-ui,sans-serif}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#070b1f;color:#f1e3bd;padding:12px 18px;border-radius:10px;z-index:90;font-weight:600;display:none;max-width:92vw}.toast.open{display:block}
/* ---------- meeting brief, viewer, presentation ---------- */
.he{direction:rtl;text-align:right;font-family:Manrope,'Segoe UI','Arial Hebrew','Noto Sans Hebrew',Arial,sans-serif}
.he .ltr{direction:ltr;text-align:left;unicode-bidi:isolate}
.meethero{background:#0c1330;color:#f3efe6;border:0;border-radius:16px;padding:24px;display:grid;gap:10px}
.meethero h2{font-family:Cardo,Georgia,serif;font-weight:400;font-size:clamp(26px,3.4vw,38px);color:#e2ad4c;margin:0}
.meethero p{margin:0;color:#d9d4c7}.meethero .count{font-weight:700;color:#fff}
.toggle{display:flex;gap:10px;align-items:center;cursor:pointer;padding:8px 0}
.toggle input{width:20px;height:20px;accent-color:#b58d2c}
.demogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.democard{border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.democard .top{padding:20px;color:#f3efe6;min-height:120px;display:flex;flex-direction:column;justify-content:flex-end}
.democard .top b{font-size:20px;font-family:Cardo,Georgia,serif;font-weight:400}.democard .top small{opacity:.8}
.democard .body{padding:14px 16px;display:grid;gap:10px}
#viewer{position:fixed;inset:0;z-index:55;background:#000;display:none;flex-direction:column}
#viewer.open{display:flex}
#viewer .vbar{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 12px;background:#0b0b0d;color:#ecebe6;font-size:14px}
#viewer .vbar a,#viewer .vbar button{color:#e3c172;background:#1b1b20;border:1px solid #2c2c33;border-radius:8px;padding:7px 12px;text-decoration:none;cursor:pointer;font-weight:600;font-size:13px}
#viewer iframe{flex:1;border:0;width:100%;background:#fff}
#present{position:fixed;inset:0;z-index:70;display:none;background:#0c1330;color:#f3efe6;font:16px/1.5 Inter,system-ui,sans-serif}
#present.open{display:block}
#present .ps{position:absolute;inset:0;display:none;overflow:auto;padding:clamp(28px,5vw,80px) clamp(22px,6vw,96px) 84px}
#present .ps.on{display:flex;flex-direction:column}
#present .pin{margin:auto 0;width:100%;position:relative;display:flex;flex-direction:column}
#present .dark{background:#0c1330;color:#f3efe6}
#present .light{background:#f6f1e6;color:#0c1330}
#present h1,#present h2{font-family:Cardo,Georgia,serif;font-weight:400;margin:0;line-height:1.04;text-wrap:balance}
#present h1{font-size:clamp(46px,7.4vw,104px)}
#present h2{font-size:clamp(32px,4.6vw,60px)}
#present h2 em,#present .tag{font-style:italic;color:#b7832a}
#present .dark h2 em,#present .dark .tag{color:#e2ad4c}
#present .tag{font-family:Cardo,Georgia,serif;font-size:clamp(20px,2.4vw,30px);margin:18px 0 0}
#present .kick,#present .eyebrow{font-size:12.5px;letter-spacing:.28em;text-transform:uppercase;color:#b7832a;font-weight:600;margin-bottom:16px}
#present .dark .eyebrow{color:#a9a79e}
#present .meta{color:#c9c4b6;margin-top:28px;font-size:17px}
#present .pfoot{position:absolute;left:clamp(22px,6vw,96px);right:clamp(22px,6vw,96px);bottom:22px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;letter-spacing:.18em;color:#8f8c84;text-transform:uppercase}
#present .contour{position:absolute;right:-6vw;top:-14vh;width:min(70vw,900px);height:auto;opacity:.95;pointer-events:none}
#present .holes{list-style:none;padding:0;margin:30px 0 0;display:grid;gap:0;max-width:960px}
#present .holes button{all:unset;cursor:pointer;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:16px;align-items:baseline;padding:16px 0;border-bottom:1px solid #d8cfbb;width:100%;font-size:clamp(17px,1.9vw,22px)}
#present .holes button b{font-family:Cardo,Georgia,serif;font-weight:400;color:#b7832a;font-size:30px}
#present .holes button i{font-style:normal;font-size:13px;color:#8a7f69;letter-spacing:.06em}
#present .holes button:hover span{color:#b7832a}
#present .pgo{margin-top:30px;align-self:flex-start;background:#0c1330;color:#f3efe6;border:0;border-radius:10px;padding:14px 24px;font:600 16px Inter,system-ui,sans-serif;cursor:pointer}
#present .note{color:#6f6656;font-family:Cardo,Georgia,serif;font-style:italic;font-size:18px;margin-top:18px}
#present .demo{padding:0;background:#0c1330}
#present .demo.on{display:block}
#pframe{position:absolute;left:0;right:0;top:0;bottom:58px}
#pframe iframe{width:100%;height:100%;border:0;background:#0c1330}
#present .prail{position:absolute;left:0;right:0;bottom:0;height:58px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#070b1f;border-top:1px solid #1d2547}
#present .prail .chips{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}
#present .prail button{flex:none;background:#121a3a;color:#d9d4c7;border:1px solid #24305c;border-radius:99px;padding:7px 12px;font:500 13px Inter,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
#present .prail button b{color:#e2ad4c;margin-right:4px}
#present .prail button.on{background:#e2ad4c;color:#0c1330;border-color:#e2ad4c}#present .prail button.on b{color:#0c1330}
#present .prail .end{background:transparent;border-color:#3a4570}
#pfallback{position:absolute;inset:0 0 58px 0;display:flex;align-items:center;justify-content:center;background:#0c1330;text-align:center;padding:30px}
#pfallback[hidden]{display:none}
#pfallback a{display:inline-block;margin:8px;background:#e2ad4c;color:#0c1330;border-radius:10px;padding:12px 18px;font-weight:700;text-decoration:none}
#pfallback a.sec{background:transparent;color:#e2ad4c;border:1px solid #e2ad4c}
#present .gantt{margin:26px 0 8px;max-width:1080px;display:grid;gap:10px}
#present .grow{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:center}
#present .grow .n{font-family:Cardo,Georgia,serif;font-size:21px}#present .grow .n small{display:block;font:600 11px Inter,sans-serif;letter-spacing:.16em;color:#8a7f69;text-transform:uppercase}
#present .track{position:relative;height:40px;border-bottom:1px solid #e0d6c2}
#present .track span{position:absolute;top:6px;height:16px;border-radius:9px;background:#0c1330}
#present .track em{position:absolute;top:25px;text-align:right;font:600 10.5px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#b7832a;font-style:normal;white-space:nowrap}
#present .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;max-width:1080px;margin-top:18px}
#present .two div{background:#fffdf8;border:1px solid #e4dac6;border-radius:12px;padding:16px 20px}
#present .two h4,#present .terms h4{margin:0 0 8px;font:600 12px Inter,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#b7832a}
#present .two ul,#present .terms ul{margin:0;padding-left:18px}#present .two li,#present .terms li{margin:4px 0}
#present .callout{max-width:1080px;background:#f3e6c6;border-radius:12px;padding:14px 20px;margin-top:16px}
#present .lede{font-size:clamp(17px,1.7vw,20px);max-width:820px;color:#3a3f57;margin:14px 0 0}
#present .steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;max-width:1080px;margin-top:26px}
#present .steps3 div{background:#fffdf8;border:1px solid #e4dac6;border-radius:12px;padding:18px 20px}
#present .steps3 i{font-family:Cardo,Georgia,serif;font-style:normal;font-size:30px;color:#b7832a}
#present .steps3 h4{font-family:Cardo,Georgia,serif;font-weight:400;font-size:24px;margin:4px 0 6px}
#present .steps3 p{margin:0;color:#3a3f57}

#present .terms{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;max-width:1080px;margin-top:18px}
#present .terms>div{background:#fffdf8;border:1px solid #e4dac6;border-radius:12px;padding:16px 20px}
#present .plans{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}

#present .plans button strong{font-size:16px;color:#0c1330;margin-top:4px;white-space:nowrap}
#present .plans button.on{border:2px solid #b7832a;background:#fbf3df}
#present .qrs{display:flex;gap:28px;flex-wrap:wrap;margin-top:34px}
#present figure{margin:0;display:flex;gap:16px;align-items:center}
#present figure svg{width:132px;height:132px;background:#fff;border-radius:10px;padding:8px}
#present figcaption b{display:block;font-family:Cardo,Georgia,serif;font-weight:400;font-size:24px;color:#f3efe6}
#present figcaption span{display:block;color:#c9c4b6;font-size:14px}#present figcaption small{display:block;color:#8f8c84;font-size:12px;margin-top:4px}
#present .pctl{position:absolute;right:56px;top:12px;display:flex;gap:6px;z-index:5}
#present .pctl button,#present .pexit{background:rgba(127,127,127,.14);border:1px solid rgba(127,127,127,.28);color:inherit;border-radius:8px;min-width:38px;height:34px;cursor:pointer;font-size:15px;opacity:.55}
#present .pexit{position:absolute;top:12px;right:12px;z-index:6;opacity:.45}
#present .pexit:hover,#present .pctl button:hover{opacity:1}
#present .ps.demo~.pctl{display:none}
#pconfirm{position:absolute;inset:0;background:rgba(5,8,20,.72);display:none;align-items:center;justify-content:center;z-index:9}
#pconfirm.open{display:flex}
#pconfirm div{background:#fffdf8;color:#0c1330;border-radius:14px;padding:22px;max-width:380px;display:grid;gap:12px}
#pconfirm button{border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;border:1px solid #0c1330;background:#fff}
#pconfirm button.y{background:#0c1330;color:#fff}

#present .pexit,#pconfirm{display:none!important}
#present .pctl{right:14px}
</style>

function presentOpen(i){const el=document.getElementById('present');if(!PR.built){el.innerHTML=slidesHTML();PR.built=true}renderTerms();el.classList.add('open');document.body.style.overflow='hidden';closeAll();ensureFrame();showSlide(i||0)}
function ensureFrame(){if(PR.frame)return;const f=document.createElement('iframe');f.src='demos/rivolt/index.html';f.title='Rivolt Practice demonstration';f.setAttribute('allow','fullscreen');document.getElementById('pframe').appendChild(f);PR.frame=f;clearTimeout(PR.timer);PR.timer=setTimeout(()=>{if(!PR.ready){const fb=document.getElementById('pfallback');if(fb)fb.hidden=false}},9000)}
function showSlide(i){i=Math.max(0,Math.min(SL.length-1,i));PR.i=i;document.querySelectorAll('#present .ps').forEach((x,k)=>x.classList.toggle('on',k===i));const demo=SL[i]==='demo',ctl=document.querySelector('#present .pctl'),ex=document.querySelector('#present .pexit');if(ctl)ctl.style.display=demo?'none':'flex';if(ex)ex.style.display=demo?'none':'block';try{history.replaceState(null,'','#rivolt')}catch(e){}}
function sceneGo(v){PR.scene=+v;document.querySelectorAll('#present .prail [data-pact="scene"]').forEach(b=>b.classList.toggle('on',+b.dataset.v===PR.scene));try{PR.frame.contentWindow.postMessage({mia:'demo',cmd:'scene',v:+v},'*')}catch(e){}}
function presentClose(){const el=document.getElementById('present');el.classList.remove('open');document.getElementById('pconfirm').classList.remove('open');document.body.style.overflow='';try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}S.view='meeting';render()}
async function fullScreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){toast("Full screen is blocked here. Use the browser's own full screen: F11 on Windows, Ctrl+Cmd+F on a Mac.")}}
function openViewer(path,title){document.getElementById('vtitle').textContent=title||'Demo';document.getElementById('vframe').src=path;document.getElementById('vfull').href=path;document.getElementById('viewer').classList.add('open');document.body.style.overflow='hidden';closeAll()}
function closeViewer(){document.getElementById('viewer').classList.remove('open');document.getElementById('vframe').src='about:blank';document.body.style.overflow=''}
window.addEventListener('message',e=>{const d=e.data||{};if(d.mia==='demo-ready'&&PR.frame&&e.source===PR.frame.contentWindow){PR.ready=true;const fb=document.getElementById('pfallback');if(fb)fb.hidden=true}});
document.getElementById('present').addEventListener('click',e=>{const b=e.target.closest('[data-pact]');if(!b)return;const a=b.dataset.pact;
 if(a==='next')showSlide(PR.i+1);else if(a==='prev')showSlide(PR.i-1);else if(a==='fs')fullScreen();
 else if(a==='hole'){showSlide(SL.indexOf('demo'));setTimeout(()=>sceneGo(b.dataset.v),PR.ready?60:1200)}
 else if(a==='scene')sceneGo(b.dataset.v);
 else if(a==='plan'){S.meet.plan=b.dataset.v;save();renderTerms()}
 else if(a==='exit')document.getElementById('pconfirm').classList.add('open');else if(a==='stay')document.getElementById('pconfirm').classList.remove('open');else if(a==='leave')presentClose()});
document.addEventListener('keydown',e=>{const pr=document.getElementById('present');if(!pr.classList.contains('open')){if(e.key==='Escape'&&document.getElementById('viewer').classList.contains('open'))closeViewer();return}
 if(e.target.closest&&e.target.closest('input,textarea,select'))return;const k=e.key;
 if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();showSlide(PR.i+1)}else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();showSlide(PR.i-1)}
 else if(k==='f'||k==='F')fullScreen();else if(k==='p'||k==='P'){S.meet.showPrices=!S.meet.showPrices;save();renderTerms()}
 else if(k==='Escape'){if(!document.fullscreenElement)document.getElementById('pconfirm').classList.toggle('open')}
 else if(/^[1-9]$/.test(k)&&SL[PR.i]==='demo')sceneGo(+k-1);
 e.stopPropagation()},true);


/* standalone: demo lives at ../demo/ on the same site, so the presentation can drive it directly */
function directScene(v){try{const d=PR.frame.contentDocument;const q=x=>d.querySelector(x);if(!q('[data-a="scene"]')){const lg=q('[data-a="login"][data-v="partner"]');if(lg)lg.click();const g=q('#guideBtn')||q('[data-a="guide"]');if(g)g.click()}const b=q('[data-a="scene"][data-v="'+v+'"]');if(b)b.click();setTimeout(()=>{const s=q('[data-a="scene"]');if(s&&s.offsetParent!==null){const gb=q('#guideBtn');if(gb)gb.click()}},80)}catch(e){}}
const _sceneGo=sceneGo;sceneGo=function(v){_sceneGo(v);directScene(+v)};
function ensureFrameStandalone(){if(PR.frame)return;const f=document.createElement('iframe');f.src='../demo/';f.title='Rivolt Practice demonstration';f.setAttribute('allow','fullscreen');f.addEventListener('load',()=>{try{if(f.contentDocument.querySelector('[data-a]')){PR.ready=true;const fb=document.getElementById('pfallback');if(fb)fb.hidden=true}}catch(e){}});document.getElementById('pframe').appendChild(f);PR.frame=f;PR.timer=setTimeout(()=>{if(!PR.ready){const fb=document.getElementById('pfallback');if(fb)fb.hidden=false}},9000)}
ensureFrame=ensureFrameStandalone;
presentClose=function(){location.href='../demo/'};
const pr=document.getElementById('present');pr.innerHTML=slidesHTML();PR.built=true;
const fb=pr.querySelector('#pfallback a[href="demos/rivolt/index.html"]');if(fb)fb.setAttribute('href','../demo/');
renderTerms();ensureFrame();showSlide(0);
}
