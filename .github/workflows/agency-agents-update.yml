# Keeps the AI agents in .claude/agents up to date from The Agency
# (github.com/msitarzewski/agency-agents, MIT licence; see .claude/agency-agents/README.md).
# Runs every Monday at 03:23 Lusaka time and by hand (Actions -> agency-agents-update -> Run workflow).
# Only the agents listed in .claude/agency-agents/agents.txt are refreshed; nothing else in the repository is touched.
# The commit message carries [skip ci], so an update starts no build, no deploy and spends no Netlify credit.
name: agency-agents-update
on:
  schedule:
    - cron: '23 1 * * 1'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: agency-agents-update, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the listed agents
        run: |
          set -eu
          base=https://raw.githubusercontent.com/msitarzewski/agency-agents/main
          grep -v '^[[:space:]]*#' .claude/agency-agents/agents.txt | sed '/^[[:space:]]*$/d' | while read -r path; do
            name=$(basename "$path")
            tmp=$(mktemp)
            if curl -fsSL --max-time 30 "$base/$path" -o "$tmp" && [ "$(head -n1 "$tmp")" = "---" ] && [ "$(wc -c < "$tmp")" -lt 200000 ]; then
              mv "$tmp" ".claude/agents/$name"
            else
              echo "::warning::kept the current copy of $name (upstream file missing or not an agent file)"
              rm -f "$tmp"
            fi
          done
      - name: Commit if anything changed
        run: |
          git config user.name "agency-agents-update"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude/agents
          if git diff --cached --quiet; then echo "Agents already up to date"; exit 0; fi
          git diff --cached --stat
          git commit -m "Update AI agents from The Agency [skip ci]"
          git push
